name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "package-lock.json" # Đã sửa thành thư mục gốc
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Lint (nếu có)
        run: npm run lint --if-present
